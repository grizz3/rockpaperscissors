<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    
    <div id="score-board">
        <p>Human: <span id="human-score">0</span> | Computer: <span id="computer-score">0</span></p>
    </div>
    
    <div id="round-count">
        <p>Rounds: <span id="round-count-display">0</span> / 5</p>
    </div>
    
    <div id="result-display">
        <p id="result-text">Choose your move!</p>
    </div>
    
    <div id="choices">
        <button id="rock-btn">Rock</button>
        <button id="paper-btn">Paper</button>
        <button id="scissors-btn">Scissors</button>
    </div>
    
    <div id="winner-display">
        <p id="winner-text"></p>
    </div>
    
    <script src="script.js"></script>

</body>
</html>
